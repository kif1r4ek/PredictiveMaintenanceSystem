<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#fff;padding:0;display:grid;grid-template-columns:1fr 1fr}
.cell{padding:26px 28px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #ECEFF3;border-right:1px solid #ECEFF3}
.cell.dark{background:#0E1116}
.n{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8A95A3}
.dark .n{color:#6B7785}
img{display:block}</style></head>
<body>
<div class="cell"><img src="../assets/logo-wordmark.svg" height="44" alt="wordmark"></div>
<div class="cell"><img src="../assets/logo-mark.svg" width="48" height="48" alt="mark"><div class="n">Primary mark</div></div>
<div class="cell"><img src="../assets/logo-mark-mono.svg" width="48" height="48" alt="mono" style="filter:none"><div class="n">Monochrome</div></div>
<div class="cell dark"><img src="../assets/logo-mark.svg" width="48" height="48" alt="on dark"><div class="n">On control-room dark</div></div>
</body></html>
