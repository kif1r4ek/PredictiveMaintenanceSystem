<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — graphite / slate" subtitle="Cool control-room neutral ramp" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:var(--font-mono);background:var(--white);padding:22px 24px}
.ramp{display:grid;grid-template-columns:repeat(11,1fr);gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--slate-200)}
.sw{height:62px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;color:rgba(255,255,255,.85)}
.sw.dk{color:rgba(0,0,0,.5)}
.lab{display:grid;grid-template-columns:repeat(11,1fr);gap:0;margin-top:7px;font-size:9.5px;color:var(--fg4);text-align:center}</style></head>
<body>
<div class="ramp">
<div class="sw" style="background:#0E1116">900</div>
<div class="sw" style="background:#161B23">800</div>
<div class="sw" style="background:#1F2630">700</div>
<div class="sw" style="background:#3A434F">600</div>
<div class="sw" style="background:#5A6675">500</div>
<div class="sw" style="background:#8A95A3">400</div>
<div class="sw dk" style="background:#B7C0CB">300</div>
<div class="sw dk" style="background:#D9DEE5">200</div>
<div class="sw dk" style="background:#ECEFF3">100</div>
<div class="sw dk" style="background:#F5F7F9">50</div>
<div class="sw dk" style="background:#F4F6F8;border-left:1px solid #eee">canvas</div>
</div>
<div class="lab"><span>ink</span><span>800</span><span>700</span><span>fg2</span><span>fg3</span><span>fg4</span><span>300</span><span>border</span><span>inset</span><span>raised</span><span>app</span></div>
</body></html>
