<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:var(--font-sans);background:var(--white);padding:22px 24px;display:flex;gap:14px}
.sw{flex:1;border-radius:8px;height:96px;border:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.sw .n{font-size:12px;font-weight:600;color:#fff}
.sw .h{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.8)}
.sw.lite .n,.sw.lite .h{color:var(--fg2)}</style></head>
<body>
<div class="sw" style="background:#1857C4"><div class="n">700 pressed</div><div class="h">#1857C4</div></div>
<div class="sw" style="background:#1F6FEB"><div class="n">600 primary</div><div class="h">#1F6FEB</div></div>
<div class="sw" style="background:#3B86F2"><div class="n">500 hover</div><div class="h">#3B86F2</div></div>
<div class="sw lite" style="background:#D6E5FD"><div class="n">100</div><div class="h">#D6E5FD</div></div>
<div class="sw lite" style="background:#ECF3FE"><div class="n">50 tint</div><div class="h">#ECF3FE</div></div>
</body></html>
