<!-- @dsCard group="Components" viewport="700x200" name="Verdict states" subtitle="Norma (healthy) vs Otkaz (failure)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:var(--font-sans);background:var(--canvas);padding:22px 24px;display:grid;gap:14px}
.v{display:flex;align-items:center;gap:16px;padding:18px;border-radius:8px;border:1px solid}
.ok{background:#E6F6EE;border-color:rgba(30,158,106,.3)}
.fail{background:#FCE8EB;border-color:rgba(215,38,61,.35)}
.ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.s{font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.sub{font-size:13px;color:var(--fg3);margin-top:3px}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:500}
.dd{width:7px;height:7px;border-radius:50%;background:currentColor}
svg{width:24px;height:24px}</style></head>
<body>
<div class="v ok"><div class="ic" style="background:#1E9E6A"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
<div><div class="s" style="color:#15784F">Норма</div><div class="sub">No failure predicted — equipment nominal</div></div>
<span class="chip" style="background:#fff;color:#15784F"><span class="dd"></span>Без отказа</span></div>
<div class="v fail"><div class="ic" style="background:#D7263D"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><circle cx="12" cy="17" r="0.6" fill="#fff" stroke="none"/></svg></div>
<div><div class="s" style="color:#B01B30">Отказ</div><div class="sub">Failure predicted — schedule maintenance</div></div>
<span class="chip" style="background:#fff;color:#B01B30"><span class="dd"></span>Отказ по мощности</span></div>
</body></html>
