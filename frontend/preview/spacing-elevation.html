<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:var(--font-sans);background:var(--canvas);padding:30px 24px;display:flex;gap:22px}
.u{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px}
.box{width:100%;height:80px;background:#fff;border:1px solid var(--slate-200);border-radius:8px}
.n{font-size:12px;font-weight:500;color:var(--fg3)}
.h{font-family:var(--font-mono);font-size:10px;color:var(--fg4)}</style></head>
<body>
<div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm · cards</div></div>
<div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md · popovers</div></div>
<div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg · overlays</div></div>
<div class="u"><div class="box" style="box-shadow:var(--shadow-focus);border-color:var(--blue-600)"></div><div class="n">focus ring</div></div>
</body></html>
