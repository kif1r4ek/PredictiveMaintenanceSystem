<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">

<style>body{margin:0;font-family:var(--font-mono);background:var(--white);padding:24px;display:flex;gap:20px;align-items:flex-end}

<div class="u"><div class="box" style="border-radius:3px"></div><div class="n">xs · 3</div></div>
<div class="u"><div class="box" style="border-radius:4px"></div><div class="n">sm · 4</div></div>
<div class="u"><div class="box" style="border-radius:6px"></div><div class="n">md · 6</div></div>
<div class="u"><div class="box" style="border-radius:8px"></div><div class="n">lg · 8</div></div>
<div class="u"><div class="box" style="border-radius:999px"></div><div class="n">pill</div></div>
