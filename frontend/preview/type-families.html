<!-- @dsCard group="Type" viewport="700x150" name="Type families" subtitle="IBM Plex Sans (UI) + IBM Plex Mono (data)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--white);color:var(--fg2);padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.fam .n{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg4);margin-bottom:8px}
.fam .big{font-size:34px;font-weight:600;color:var(--fg1);line-height:1;letter-spacing:-.01em}
.fam .lo{font-size:13px;color:var(--fg4);margin-top:10px}
.mono .big{font-family:var(--font-mono);font-weight:500}</style></head>
<body>
<div class="fam"><div class="n">IBM Plex Sans · UI</div><div class="big">Aa Bb Cc</div><div class="lo">400 Regular · 500 Medium · 600 Semibold · 700 Bold</div></div>
<div class="fam mono"><div class="n">IBM Plex Mono · Data</div><div class="big">0 1 2 4 8.6</div><div class="lo">Sensor values · IDs · probabilities · tabular-nums</div></div>
</body></html>
