<!-- @dsCard group="Type" viewport="700x170" name="Data readouts (mono)" subtitle="Tabular metrics & uppercase labels" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--white);color:var(--fg2);padding:24px;display:flex;gap:40px;align-items:center}
.blk .l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg4);margin-bottom:10px}
.metric{font-family:var(--font-mono);font-weight:500;color:var(--fg1);font-variant-numeric:tabular-nums;line-height:1}
.s{color:var(--fg4)}</style></head>
<body>
<div class="blk"><div class="l">Metric · xl 44</div><div class="metric" style="font-size:44px">91<span class="s">%</span></div></div>
<div class="blk"><div class="l">Metric · lg 28</div><div class="metric" style="font-size:28px">1372<span class="s"> rpm</span></div></div>
<div class="blk"><div class="l">Metric · sm 16</div><div class="metric" style="font-size:16px">12.8 ms</div></div>
<div class="blk"><div class="l">Label · micro 11</div><div class="ds-label" style="color:var(--fg2)">Failure probability</div></div>
</body></html>
