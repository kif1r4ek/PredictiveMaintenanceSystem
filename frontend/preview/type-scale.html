<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--white);color:var(--fg2);padding:22px 24px}
.row{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--slate-100)}
.row:last-child{border:0}
.tag{font-family:var(--font-mono);font-size:11px;color:var(--fg4);width:120px;flex:0 0 120px}
.spec{color:var(--fg1)}</style></head>
<body>
<div class="row"><span class="tag">display · 40/700</span><span class="spec ds-display" style="font-size:30px">Failure predicted</span></div>
<div class="row"><span class="tag">h1 · 30/600</span><span class="spec ds-h1" style="font-size:24px">Operator dashboard</span></div>
<div class="row"><span class="tag">h2 · 23/600</span><span class="spec ds-h2">Prediction result</span></div>
<div class="row"><span class="tag">h3 · 18/600</span><span class="spec ds-h3">Submitted features</span></div>
<div class="row"><span class="tag">body · 15/400</span><span class="spec ds-body">No failure predicted — equipment nominal.</span></div>
<div class="row"><span class="tag">small · 13/400</span><span class="spec ds-small">GET /history?source=redis</span></div>
<div class="row"><span class="tag">caption · 12/400</span><span class="spec ds-caption">Inference time 12.8 ms</span></div>
</body></html>
