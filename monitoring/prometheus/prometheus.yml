global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Сам Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Backend FastAPI — метрики через prometheus-fastapi-instrumentator
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
